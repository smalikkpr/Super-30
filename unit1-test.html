    let chosenParts = [];    // which parts the student chose

    let current = 0;
    let score = 0;
    let partScores = [0, 0, 0, 0];

    // 3. MAKE THE QUESTION LIST FROM THE CHOSEN PARTS
    function buildQuestions() {
      allQuestions = [];
      chosenParts.forEach(function (partIndex) {
        parts[partIndex].questions.forEach(function (question) {
          question.part = partIndex;
          allQuestions.push(question);
        });
      });
    }

    // 4. FIND THE PARTS OF THE PAGE WE WILL CHANGE
    const startScreen = document.getElementById("startScreen");
    const quizScreen = document.getElementById("quizScreen");
    const resultScreen = document.getElementById("resultScreen");
    const questionEl = document.getElementById("question");
    const instructionEl = document.getElementById("instruction");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const explainEl = document.getElementById("explain");

    // 5. SHOW ONE QUESTION
    function showQuestion() {
      const q = allQuestions[current];
      const part = parts[q.part];

      document.getElementById("counter").textContent = "Question " + (current + 1) + " of " + allQuestions.length;
      document.getElementById("partName").textContent = part.name;
      document.getElementById("bar").style.width = (current / allQuestions.length) * 100 + "%";

      instructionEl.textContent = q.i || part.instruction;
      // A word between *stars* becomes bold and underlined
      questionEl.innerHTML = q.q.replace(/\*(.+?)\*/g, "<strong>$1</strong>");
      questionEl.className = part.urdu ? "question passage" : "question";

      feedbackEl.textContent = "";
      explainEl.classList.add("hidden");
      nextBtn.classList.add("hidden");
      optionsEl.innerHTML = "";

      q.options.forEach(function (text, index) {
        const button = document.createElement("button");
        button.className = part.urdu ? "option urdu" : "option";
        button.textContent = part.urdu ? text : String.fromCharCode(65 + index) + ")  " + text;
        button.addEventListener("click", function () {
          checkAnswer(index);
        });
        optionsEl.appendChild(button);
      });
    }

    // 6. CHECK THE ANSWER
    function checkAnswer(chosen) {
      const q = allQuestions[current];
      const buttons = optionsEl.querySelectorAll(".option");

      buttons.forEach(function (b) { b.disabled = true; });
      buttons[q.answer].classList.add("right");

      if (chosen === q.answer) {
        score = score + 1;
        partScores[q.part] = partScores[q.part] + 1;
        feedbackEl.textContent = "✓ Correct!";
        feedbackEl.style.color = "var(--right)";
      } else {
        buttons[chosen].classList.add("wrong");
        feedbackEl.textContent = "✗ Wrong. The right answer is shown in green.";
        feedbackEl.style.color = "var(--wrong)";

        // Show WHY the answer is wrong.
        // "why" is either one sentence, or a list with one sentence for each option.
        let reason = Array.isArray(q.why) ? q.why[chosen] : q.why;
        explainEl.innerHTML = "<strong>Why?</strong> " + reason;
        explainEl.classList.remove("hidden");
        explainEl.scrollIntoView({ behavior: "smooth", block: "nearest" });  // scroll down to the reason
      }

      document.getElementById("scoreNow").textContent = "Score: " + score;
      nextBtn.textContent = (current === allQuestions.length - 1) ? "See My Result" : "Next Question";
      nextBtn.classList.remove("hidden");
    }

    // 7. NEXT QUESTION, OR THE RESULT
    nextBtn.addEventListener("click", function () {
      current = current + 1;
      if (current < allQuestions.length) {
        showQuestion();
      } else {
        showResult();
      }
    });

    // 8. THE RESULT SCREEN
    function showResult() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      document.getElementById("finalScore").textContent = score + " / " + allQuestions.length;

      // One part: show its name. Full test: show a row for each part.
      let rows = "";
      if (chosenParts.length === 1) {
        document.getElementById("resultName").textContent = parts[chosenParts[0]].name;
      } else {
        document.getElementById("resultName").textContent = "Full Test";
        chosenParts.forEach(function (i) {
          rows += "<tr><td>" + parts[i].name + "</td><td>" + partScores[i] + " / " + parts[i].questions.length + "</td></tr>";
        });
      }
      document.getElementById("partTable").innerHTML = rows;

      const percent = (score / allQuestions.length) * 100;
      let message;
      if (percent >= 90) {
        message = "Excellent! You know this chapter very well.";
      } else if (percent >= 70) {
        message = "Very good! Revise the part with the lowest score.";
      } else if (percent >= 50) {
        message = "Good try. Read the chapter again and retake the test.";
      } else {
        message = "Read the chapter carefully, then try again.";
      }
      document.getElementById("message").textContent = message;
    }

      score = 0;
      partScores = [0, 0, 0, 0];
      document.getElementById("scoreNow").textContent = "Score: 0";
      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      showQuestion();
    }

    // Each part button starts only that part
    [0, 1, 2, 3].forEach(function (i) {
      document.getElementById("part" + i).addEventListener("click", function () {
        chosenParts = [i];
        startTest();
      });
    });

    // The full test button starts all four parts
    document.getElementById("allBtn").addEventListener("click", function () {
      chosenParts = [0, 1, 2, 3];
      startTest();
    });

    // 10. LEAVE THE TEST IN THE MIDDLE: go back to the list of tests
    document.getElementById("leaveBtn").addEventListener("click", function () {
      quizScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });

    // 11. AFTER THE RESULT
    document.getElementById("restartBtn").addEventListener("click", startTest);
    document.getElementById("menuBtn").addEventListener("click", function () {
      resultScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });
  </script>

</body>
</html>
